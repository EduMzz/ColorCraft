[package]
name = "colorcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"
[dependencies]
colorcraft-bridge = { path = "../bridge" }
colorcraft-core.workspace = true
colorcraft-storage.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
craft-ui.workspace = true
craft-settings.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
resvg = "0.45"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025"] }
rfd = "0.17"
webbrowser = "1"
kurbo = "0.13"
chrono = "0.4.45"
[build-dependencies]
winresource = "0.1"
[lints]
workspace = true
